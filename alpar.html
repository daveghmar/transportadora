<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador Alpar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #007bff, #00b4d8);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    input {
      text-align: center;
      font-size: 1.2rem;
    }
    table {
      background: white;
      color: black;
      border-radius: 10px;
      overflow: hidden;
      th:nth-child(1) { width: 50px; text-align: center; }
      th:nth-child(2) { width: auto; }
      th:nth-child(3) { width: 120px; text-align: center; }
      th:nth-child(4) { width: 90px; text-align: center; }
    }
    .btn {
      border-radius: 50px;
    }
    .botao-voltar {
     position: fixed;
     top: 15px;
     left: 15px;
     background: linear-gradient(135deg, #007bff, #00b4d8);
     color: white;
     text-decoration: none;
     font-weight: 600;
     padding: 10px 18px;
     border-radius: 25px;
     box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
     transition: all 0.25s ease;
     z-index: 1000;
    }
    .botao-voltar:hover {
     background: linear-gradient(135deg, #00b4d8, #007bff);
     transform: translateY(-2px);
     box-shadow: 0 6px 15px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>

<a href="index.html" class="botao-voltar">⬅️</a>
    
<div class="container text-center">
  <h2 class="mb-3">Alpar</h2>

  <input id="barcodeInput" type="text" class="form-control mb-3" placeholder="Código aqui" autofocus>

  <h4 class="mb-3">📦 Total de Códigos: <span id="total">0</span></h4>

  <div class="d-flex justify-content-center gap-2 mb-3">
    <button class="btn btn-success" onclick="exportarExcel()">📊 Exportar Excel</button>
    <button class="btn btn-danger" onclick="limpar()">🗑️ Limpar Tudo</button>
  </div>

  <table class="table table-sm table-bordered">
    <thead class="table-light">
      <tr>
        <th>#</th>
        <th>Código</th>
        <th>Hora</th>
        <th>❌</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>
</div>

<script>
  const input = document.getElementById('barcodeInput');
  const tabela = document.getElementById('tabela');
  const total = document.getElementById('total');

  let codigos = JSON.parse(localStorage.getItem('codigos_alparl') || '[]');

  atualizarTela();

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const codigo = input.value.trim();

      if (codigo && !codigos.some(item => item.codigo === codigo)) {
        // 🕒 pegar hora atual
        const hora = new Date().toLocaleTimeString('pt-BR');
        codigos.push({ codigo, hora });
        salvar();
        atualizarTela();
      }

      input.value = '';
    }
  });

  function salvar() {
    localStorage.setItem('codigos_alparl', JSON.stringify(codigos));
  }

  function atualizarTela() {
    tabela.innerHTML = '';
    codigos.forEach((item, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${i + 1}</td>
        <td>${item.codigo}</td>
        <td>${item.hora}</td>
        <td>
          <button class="btn btn-sm btn-danger" onclick="limparcod(${i})">Excluir</button>
        </td>`;
      tabela.appendChild(tr);
    });
    total.textContent = codigos.length;
  }

  function limparcod(index) {
    if (confirm('Tem certeza que deseja remover este código?')) {
      codigos.splice(index, 1);
      salvar();
      atualizarTela();
    }
  }

  function limpar() {
    if (confirm('Tem certeza que deseja limpar todos os códigos?')) {
      codigos = [];
      salvar();
      atualizarTela();
    }
  }

  function exportarExcel() {
    if (codigos.length === 0) {
      alert('Nenhum código para exportar.');
      return;
    }

    const marcaNome = "Alpar";
    let esperado = 0;
    try {
      const esperadoPorMarca = JSON.parse(localStorage.getItem('esperado_por_marca') || '{}');
      esperado = esperadoPorMarca[marcaNome] || 0;
    } catch (e) {}

    const lido = codigos.length;
    const faltam = esperado - lido;
    const dataHoje = new Date().toLocaleDateString('pt-BR');

    // ---------- estilos ----------
    const lado = { style: 'thin', color: { rgb: 'BFBFBF' } };
    const borda = { top: lado, bottom: lado, left: lado, right: lado };
    const centro = { horizontal: 'center', vertical: 'center' };
    const sCab = { font: { bold: true, color: { rgb: 'FFFFFF' }, sz: 12 }, fill: { fgColor: { rgb: '007BFF' } }, alignment: centro, border: borda };
    const sTitulo = { font: { bold: true, sz: 16, color: { rgb: '004692' } }, alignment: { horizontal: 'left', vertical: 'center' } };
    const sSub = { font: { italic: true, color: { rgb: '666666' } }, alignment: { horizontal: 'left' } };
    const cab = t => ({ v: t, t: 's', s: sCab });
    const txt = (v, fill) => ({ v: String(v), t: 's', s: { alignment: centro, border: borda, fill: fill ? { fgColor: { rgb: fill } } : undefined } });
    const num = (v, fill, bold, cor) => ({ v: v, t: 'n', s: { alignment: centro, border: borda, font: { bold: !!bold, sz: bold ? 13 : 11, color: cor ? { rgb: cor } : undefined }, fill: fill ? { fgColor: { rgb: fill } } : undefined } });

    const corFaltam = faltam <= 0 ? 'C6EFCE' : 'FFC7CE';
    const corTxtFaltam = faltam <= 0 ? '006100' : '9C0006';

    // ---------- uma única aba: resumo em cima, lista embaixo ----------
    const aoa = [
      [{ v: marcaNome, t: 's', s: sTitulo }],
      [{ v: 'Gerado em ' + dataHoje, t: 's', s: sSub }],
      [],
      [cab('Esperado'), cab('Lido'), cab('Faltam')],
      [num(esperado, null, true), num(lido, null, true), num(faltam, corFaltam, true, corTxtFaltam)],
      [],
      [cab('#'), cab('Código'), cab('Hora')]
    ];
    const linhaCab = aoa.length; // número (1-based) da linha do cabeçalho da lista
    codigos.forEach((c, i) => {
      const zebra = i % 2 === 1 ? 'F2F7FF' : null;
      aoa.push([ num(i + 1, zebra), txt(c.codigo, zebra), txt(c.hora, zebra) ]);
    });

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const maxCod = Math.max(18, ...codigos.map(c => String(c.codigo).length)) + 4;
    ws['!cols'] = [{ wch: 14 }, { wch: maxCod }, { wch: 18 }];
    ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 2 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: 2 } }];
    ws['!autofilter'] = { ref: 'A' + linhaCab + ':C' + aoa.length };
    ws['!rows'] = [{ hpt: 26 }, {}, {}, { hpt: 22 }, { hpt: 24 }, {}, { hpt: 22 }];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Contagem');

    const dataArq = dataHoje.replace(/\//g, '-');
    XLSX.writeFile(wb, marcaNome.replace(/\s+/g, '_') + '_' + dataArq + '.xlsx');
  }

  
window.addEventListener('click', () => input.focus());
</script>

</body>
</html>
